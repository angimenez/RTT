<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="0" y1="326" x2="0" y2="444">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <!-- letras KIKI como trazos: stem + brazos de la K, barra de la I -->
    <g id="kiki" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M112 338 V432 M134 386 L180 338 M144 380 L182 432"/>
      <path d="M226 338 V432"/>
      <path d="M270 338 V432 M292 386 L338 338 M302 380 L340 432"/>
      <path d="M384 338 V432"/>
    </g>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- play + ondas, más pequeño y arriba -->
  <g transform="translate(68 31) scale(0.62)">
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="26" opacity="0.9">
      <path d="M338 196 Q372 256 338 316"/>
      <path d="M382 150 Q448 256 382 362" opacity="0.65"/>
    </g>
    <path d="M158 142 L158 370 Q158 392 178 381 L318 272 Q334 256 318 240 L178 131 Q158 120 158 142 Z"
          fill="url(#play)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- KIKI: sombra, contorno oscuro, relleno de fuego y brillo; ligeramente inclinado -->
  <g transform="translate(8 0) rotate(-4 256 385)">
    <use href="#kiki" stroke="#1e1b4b" stroke-opacity="0.55" stroke-width="44" transform="translate(6 9)"/>
    <use href="#kiki" stroke="#1e1b4b" stroke-width="46"/>
    <use href="#kiki" stroke="url(#fire)" stroke-width="30"/>
    <use href="#kiki" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" transform="translate(-8 -2)"/>
  </g>

  <!-- chispas -->
  <g fill="#fde047" stroke="#1e1b4b" stroke-width="4" stroke-linejoin="round">
    <path d="M70 300 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 z" transform="translate(6 -12) scale(0.8)"/>
    <path d="M440 290 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 z"/>
  </g>
</svg>
